<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet" />

  <!-- fontawesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <title>Todos App + Weather</title>
</head>

<body>

  <!-- weather app -->
  <div class="container">
    <div class="weather" id="weather-display"></div>
    <div class="search-bar">
      <input id="input-city" type="text" placeholder="Cari kota..." />
      <button id="btn-search"><i class="fa fa-search"></i></button>
    </div>
  </div>

  <!-- todo app -->
  <main class="app">
    <header class="app-header">
      <h2>Your Task Today</h2>
    </header>
    <form class="todo-form" id="todo-form">
      <input type="text" class="todo-input" id="todo-input" placeholder="What will you do? (enter)" />
    </form>
    <nav class="filters" id="filters">
      <button class="btn-filter active" data-filter="all">All</button>
      <button class="btn-filter" data-filter="active">Active</button>
      <button class="btn-filter" data-filter="completed">Done</button>
      <span class="count" id="items-left"></span>
    </nav>
    <ul class="todo-list" id="todo-list"></ul>
    <p class="empty-state" id="empty-state">No Todos? Add one above!</p>
  </main>

  <script src="script.js"></script>
</body>

</html>
